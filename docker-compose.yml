services:
  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=senha
      - POSTGRES_DB=comunet

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
